[package]
name = "forge-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { version = "28.0.0", features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.1", default-features = false }
rand = "0.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
